; PlatformIO project configuration for the K3NG CW Keyer
;
; This does not change anything about the existing Arduino IDE layout: the
; sketch stays in k3ng_keyer/ and third-party libraries stay in libraries/.
; PlatformIO is pointed at both in place.
;
; Hardware/feature selection normally happens by uncommenting a HARDWARE_xxx
; define in k3ng_keyer/keyer_hardware.h. Here we do the same thing instead
; via build_flags (-D HARDWARE_xxx), so no source file needs to be edited to
; switch targets - just run a different environment.
;
; Usage:
;   pio run -e uno              (or nano / mega2560 / leonardo)
;   pio run -e esp32wroom
;   pio run -t upload -e uno
;
; To add an environment for one of the other named hardware kits (Nanokeyer,
; TinyKeyer, Mortty variants, K5BCQ, YaacWK, MegaKeyer, OpenCWKeyer MK2,
; IZ3GME, YCCC SO2R mini, Open Interface, FK-10/FK-11), copy the [env:uno]
; block below, rename it, and set build_flags to the matching HARDWARE_xxx
; define from k3ng_keyer/keyer_hardware.h. Those kits are AVR pin/feature
; profiles layered on whatever board you actually built the kit on, so pick
; the `board =` that matches your hardware (keyer_hardware.h's comments say
; FK-10/FK-11 need `board = megaatmega2560`). Some of these enable code paths
; that also need hardware-specific manual source edits regardless of build
; tool - e.g. FK-10/FK-11 need the 3 USB includes near "note_usb_uncomment_lines"
; in k3ng_keyer.ino uncommented, exactly as Arduino IDE users must also do -
; that particular code path also has a pre-existing narrowing-conversion
; build error unrelated to PlatformIO, so treat it as a starting point, not
; a verified target.
;
; Not covered here: HARDWARE_MAPLE_MINI and HARDWARE_GENERIC_STM32F103C.
; keyer_stm32duino.h is written against the old, community-maintained Roger
; Clark "Maple core" (rogerclarkmelbourne/Arduino_STM32), not the modern
; official STM32duino core that PlatformIO's ststm32 platform's
; `framework = arduino` provides today, so `board = maple_mini_b20` /
; `genericSTM32F103C8` won't compile this project as-is. Building for those
; boards still requires the Arduino IDE with the Roger Clark core installed.

[platformio]
default_envs = uno
src_dir = k3ng_keyer

[env]
lib_extra_dirs = libraries
lib_ldf_mode = deep+
framework = arduino
; PlatformIO's framework-arduino-avr package doesn't bundle LiquidCrystal the way the Arduino IDE's
; AVR core install does. FEATURE_LCD_4BIT/FEATURE_LCD_8BIT need it; harmless to have available
; otherwise since the Library Dependency Finder only links what's actually #included.
lib_deps = arduino-libraries/LiquidCrystal

; Default AVR profile: no HARDWARE_xxx define, so keyer_features_and_options.h
; / keyer_pin_settings.h (the generic ones) are used, same as a bare
; Arduino IDE build with nothing selected in keyer_hardware.h.

[env:uno]
platform = atmelavr
board = uno

[env:nano]
platform = atmelavr
board = nanoatmega328

[env:mega2560]
platform = atmelavr
board = megaatmega2560

[env:leonardo]
platform = atmelavr
board = leonardo

; Named/documented hardware targets below select a HARDWARE_xxx profile via
; build_flags instead of editing keyer_hardware.h.

[env:esp32wroom]
platform = espressif32
board = esp32dev
build_flags = -D HARDWARE_ESP32_WROOM_KEYER
; keyer_features_and_options_esp32wroom.h enables FEATURE_OLED_SSD1306, which needs this
; third-party library (not vendored in libraries/, same as an Arduino IDE Library Manager install)
lib_deps = greiman/SSD1306Ascii
